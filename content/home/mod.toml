# starwind as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `starwind-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "14eca538-2918-4b4f-90ae-80b764a62e57"
slug = "starwind"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.starwind"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
