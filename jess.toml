manifest_version = 1

[package]
id = "org.dreamweave.starwind"
version = "0.1.0"
jess_api = "1"
default_target = "starwind"
include = ["src", "tests"]
tests = [
  "tests/run.jsl",
  "tests/build.jsl",
  "tests/reports.jsl",
  "tests/cli.jsl",
  "tests/style.jsl",
]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3conv" = "0.1"
"org.dreamweave.merge-to-master" = "0.1"
"org.dreamweave.add-vanilla-refs" = "0.1"

[modules]
"@starwind" = "src/init.jsl"
"@starwind/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. `build` reads and writes files, so its caller needs both.

[[layer]]
id = "starwind.core"
requires = ["tes3.core", "tes3conv.core", "merge-to-master.core", "add-vanilla-refs.core"]
exports = ["@starwind", "@starwind/cli"]

# The build's command line: `src/main.jsl` hands its arguments to `@starwind/cli`. The build
# reads the JSON sources under <root>/plugins and reads back the plugins it wrote
# (filesystem.read), and makes its output folders and writes the plugins, reports, and manifest
# into them (filesystem.write). It reads no environment, runs no other program, and opens no
# connection.

[targets.starwind]
kind = "command"
command = "starwind"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.stdio"]
